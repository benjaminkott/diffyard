name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A named image rather than `ubuntu-latest`: that label moves to the next
    # Ubuntu on a date GitHub picks, and with it the system libraries Playwright
    # installs for Chromium. Which image the tests run on is a decision to make
    # here, not one to be made by a calendar.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The report tests open the generated HTML in a real browser, so the
      # browser has to be there before they run.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test
